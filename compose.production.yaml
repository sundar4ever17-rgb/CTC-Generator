name: ctc-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api: &api
  image: ${CTC_API_IMAGE:?Set CTC_API_IMAGE to the tested image digest}
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
    - seccomp=./scripts/security/chromium-seccomp.json
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=512m,mode=1777
  shm_size: 256mb
  init: true
  pids_limit: 256
  mem_limit: 2g
  cpus: 2
  logging: *logging
  networks: [application, database_egress]

services:
  backend:
    <<: *api
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_ORIGIN: https://${CTC_DOMAIN:?Set CTC_DOMAIN}
      PORT: "8080"
      DATABASE_URL_FILE: /run/secrets/database_url
      DB_POOL_MAX_CONNS: ${DB_POOL_MAX_CONNS:-20}
      CHROME_PATH: /usr/bin/chromium
    secrets: [database_url, postgres_ca]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", http://127.0.0.1:8080/api/health]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  frontend:
    image: ${CTC_WEB_IMAGE:?Set CTC_WEB_IMAGE to the tested image digest}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
      - /app/.next/cache:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      API_INTERNAL_URL: http://backend:8080
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    init: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    logging: *logging
    networks: [application]

  proxy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to a reviewed Caddy 2 image digest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "80:80"
      - "443:443"
    environment:
      CTC_DOMAIN: ${CTC_DOMAIN:?Set CTC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./scripts/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    depends_on:
      frontend:
        condition: service_healthy
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    logging: *logging
    networks: [application, edge]

  migrate:
    <<: *api
    profiles: [operations]
    command: [/app/ctc-api, migrate]
    environment:
      APP_ENV: production
      APP_ORIGIN: https://${CTC_DOMAIN:?Set CTC_DOMAIN}
      DATABASE_URL_FILE: /run/secrets/migrator_database_url
    secrets: [migrator_database_url, postgres_ca]

  bootstrap-admin:
    <<: *api
    profiles: [operations]
    command: [/app/ctc-api, bootstrap-admin]
    environment:
      APP_ENV: production
      APP_ORIGIN: https://${CTC_DOMAIN:?Set CTC_DOMAIN}
      DATABASE_URL_FILE: /run/secrets/migrator_database_url
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
    secrets: [migrator_database_url, postgres_ca, bootstrap_admin_password]

networks:
  application:
    internal: true
  database_egress: {}
  edge: {}

volumes:
  caddy_data:
  caddy_config:

secrets:
  database_url:
    file: ${DATABASE_URL_FILE:?Set DATABASE_URL_FILE}
  migrator_database_url:
    file: ${MIGRATOR_DATABASE_URL_FILE:?Set MIGRATOR_DATABASE_URL_FILE}
  postgres_ca:
    file: ${POSTGRES_CA_FILE:?Set POSTGRES_CA_FILE}
  bootstrap_admin_password:
    file: ${BOOTSTRAP_ADMIN_PASSWORD_FILE:?Set BOOTSTRAP_ADMIN_PASSWORD_FILE}
